<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>야구 AI 심판</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #050505;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

#app {
  width: 100vw;
  height: 100vh;
  position: relative;
  background: #000;
  overflow: hidden;
}

/* 카메라 */
#video {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: scaleX(-1);
}

/* 분석용 캔버스 */
#canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  transform: scaleX(-1);
}

/* 위쪽 */
#top {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  padding: 15px;
  z-index: 10;
  display: flex;
  justify-content: space-between;
  align-items: center;
  pointer-events: none;
}

#title {
  color: white;
  font-size: 18px;
  font-weight: bold;
  text-shadow: 0 2px 5px #000;
}

#count {
  background: rgba(0,0,0,.65);
  color: white;
  padding: 9px 15px;
  border-radius: 12px;
  font-size: 19px;
  font-weight: bold;
  text-shadow: 0 1px 3px #000;
}

/* 스트라이크존 */
#zone {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 32vw;
  height: 45vh;
  max-width: 300px;
  max-height: 430px;
  min-width: 150px;
  min-height: 210px;
  transform: translate(-50%, -50%);
  border: 2px solid rgba(255,255,255,.65);
  box-shadow: 0 0 8px rgba(255,255,255,.15);
  z-index: 5;
  pointer-events: none;
}

.zone-line {
  position: absolute;
  background: rgba(255,255,255,.22);
}

.zone-line.v1 {
  width: 1px;
  height: 100%;
  left: 50%;
}

.zone-line.h1 {
  height: 1px;
  width: 100%;
  top: 50%;
}

/* 결과 */
#result {
  position: absolute;
  left: 50%;
  top: 20%;
  transform: translate(-50%, -50%);
  z-index: 20;

  font-size: clamp(45px, 12vw, 100px);
  font-weight: 900;
  color: white;

  opacity: 0;
  transition: opacity .15s, transform .15s;

  text-shadow:
    0 3px 10px #000,
    0 0 25px rgba(255,255,255,.5);

  pointer-events: none;
  white-space: nowrap;
}

#result.show {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1.05);
}

/* 시작 버튼 */
#startScreen {
  position: absolute;
  inset: 0;
  z-index: 50;
  background: rgba(0,0,0,.82);

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  color: white;
}

#startScreen h1 {
  margin: 0 0 10px;
  font-size: 32px;
}

#startScreen p {
  margin: 0 0 25px;
  color: #ccc;
}

button {
  border: 0;
  border-radius: 14px;
  padding: 15px 30px;
  font-size: 19px;
  font-weight: bold;
  background: white;
  color: black;
  cursor: pointer;
}

/* 아래 버튼 */
#bottom {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 30;
}

#pitchButton {
  min-width: 150px;
  background: rgba(0,0,0,.75);
  color: white;
  border: 2px solid rgba(255,255,255,.7);
  padding: 13px 25px;
}

/* 모바일 */
@media (max-width: 600px) {
  #zone {
    width: 48vw;
    height: 42vh;
  }

  #title {
    font-size: 15px;
  }

  #count {
    font-size: 17px;
  }
}
</style>
</head>

<body>

<div id="app">

  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>

  <div id="top">
    <div id="title">⚾ AI 야구 심판</div>
    <div id="count">
      S <span id="strikeCount">0</span>
      &nbsp;&nbsp;
      B <span id="ballCount">0</span>
    </div>
  </div>

  <div id="zone">
    <div class="zone-line v1"></div>
    <div class="zone-line h1"></div>
  </div>

  <div id="result"></div>

  <div id="bottom">
    <button id="pitchButton">투구 시작</button>
  </div>

  <div id="startScreen">
    <h1>⚾ AI 야구 심판</h1>
    <p>카메라를 켜고 투구하세요</p>
    <button id="startButton">카메라 시작</button>
  </div>

</div>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", { willReadFrequently: true });

const startScreen = document.getElementById("startScreen");
const startButton = document.getElementById("startButton");
const pitchButton = document.getElementById("pitchButton");

const result = document.getElementById("result");
const strikeCountText = document.getElementById("strikeCount");
const ballCountText = document.getElementById("ballCount");

let stream = null;

let strikeCount = 0;
let ballCount = 0;

let detecting = false;
let detectedFrames = 0;
let lastBall = null;
let trajectory = [];

let lastResultTime = 0;

/*
  공 판정 설정

  화면에서 스트라이크존의 위치를 기준으로
  공이 홈플레이트에 도착했다고 판단할 때 판정한다.

  공이 카메라 쪽으로 가까워지면서 크기가 커지는 것을
  이용해서 '판정면' 도착 시점을 잡는다.
*/

const MIN_BRIGHTNESS = 145;
const MAX_BRIGHTNESS = 255;

const BALL_MIN_SIZE = 2;
const BALL_MAX_SIZE = 120;

const ARRIVAL_SIZE = 20;


/* -------------------------
   카메라 시작
------------------------- */

async function startCamera() {

  try {

    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: {
          ideal: "user"
        },
        width: {
          ideal: 1280
        },
        height: {
          ideal: 720
        }
      },
      audio: false
    });

    video.srcObject = stream;

    await video.play();

    startScreen.style.display = "none";

    resizeCanvas();

  } catch (error) {

    alert(
      "카메라를 사용할 수 없습니다.\n\n" +
      "아이폰에서는 Safari에서 카메라 권한을 허용해주세요."
    );

    console.error(error);
  }
}


startButton.addEventListener("click", async () => {

  // 아이폰에서 음성 기능을 활성화하기 위한 사용자 동작
  try {
    speechSynthesis.cancel();
  } catch(e) {}

  await startCamera();

});


/* -------------------------
   화면 크기
------------------------- */

function resizeCanvas() {

  canvas.width = video.videoWidth || window.innerWidth;
  canvas.height = video.videoHeight || window.innerHeight;

}

window.addEventListener("resize", resizeCanvas);


/* -------------------------
   투구 시작
------------------------- */

pitchButton.addEventListener("click", () => {

  if (!video.srcObject) {
    return;
  }

  detecting = true;
  detectedFrames = 0;
  lastBall = null;
  trajectory = [];

  result.className = "";
  result.textContent = "";

  pitchButton.textContent = "공을 던지세요";

});


/* -------------------------
   공 찾기
------------------------- */

function findBall() {

  if (!video.videoWidth || !video.videoHeight) {
    return null;
  }

  /*
    분석용 크기를 줄여서 휴대폰에서도 빠르게 작동
  */

  const w = 240;
  const h = Math.round(
    video.videoHeight / video.videoWidth * w
  );

  canvas.width = w;
  canvas.height = h;

  ctx.drawImage(video, 0, 0, w, h);

  const image = ctx.getImageData(0, 0, w, h);
  const data = image.data;

  let candidates = [];

  /*
    너무 가장자리인 부분은 제외
  */

  for (let y = 8; y < h - 8; y += 3) {

    for (let x = 8; x < w - 8; x += 3) {

      const i = (y * w + x) * 4;

      const r = data[i];
      const g = data[i + 1];
      const b = data[i + 2];

      const brightness =
        (r + g + b) / 3;

      /*
        흰색/밝은색 공
      */

      const whiteBall =
        brightness >= MIN_BRIGHTNESS &&
        Math.max(r,g,b) - Math.min(r,g,b) < 45;

      /*
        주황색/노란색 탁구공도 인식
      */

      const orangeBall =
        r > 130 &&
        r > g * 1.25 &&
        g > b * 1.2;

      if (!whiteBall && !orangeBall) {
        continue;
      }

      /*
        주변에 같은 색 픽셀이 얼마나 있는지 검사
      */

      let count = 0;

      for (let yy = -5; yy <= 5; yy += 2) {

        for (let xx = -5; xx <= 5; xx += 2) {

          const nx = x + xx;
          const ny = y + yy;

          if (
            nx < 0 ||
            ny < 0 ||
            nx >= w ||
            ny >= h
          ) continue;

          const ni = (ny * w + nx) * 4;

          const nr = data[ni];
          const ng = data[ni + 1];
          const nb = data[ni + 2];

          const nbri =
            (nr + ng + nb) / 3;

          const nw =
            nbri >= MIN_BRIGHTNESS &&
            Math.max(nr,ng,nb) -
            Math.min(nr,ng,nb) < 50;

          const no =
            nr > 130 &&
            nr > ng * 1.25 &&
            ng > nb * 1.2;

          if (nw || no) {
            count++;
          }
        }
      }

      if (count >= 5) {

        candidates.push({
          x,
          y,
          score: count
        });

      }

    }
  }

  if (candidates.length === 0) {
    return null;
  }

  /*
    이전 공 위치가 있으면 가까운 후보를 우선
  */

  if (lastBall) {

    candidates.sort((a,b) => {

      const da =
        Math.hypot(
          a.x - lastBall.x,
          a.y - lastBall.y
        );

      const db =
        Math.hypot(
          b.x - lastBall.x,
          b.y - lastBall.y
        );

      return da - db;

    });

  } else {

    candidates.sort(
      (a,b) => b.score - a.score
    );

  }

  const ball = candidates[0];

  /*
    공 크기 추정
  */

  let radius = 3;

  for (let r = 3; r <= 20; r += 2) {

    let good = 0;

    for (let a = 0; a < 360; a += 30) {

      const rad = a * Math.PI / 180;

      const px =
        Math.round(ball.x + Math.cos(rad) * r);

      const py =
        Math.round(ball.y + Math.sin(rad) * r);

      if (
        px >= 0 &&
        py >= 0 &&
        px < w &&
        py < h
      ) {

        const pi =
          (py * w + px) * 4;

        const rr = data[pi];
        const gg = data[pi+1];
        const bb = data[pi+2];

        const br =
          (rr + gg + bb) / 3;

        const white =
          br >= MIN_BRIGHTNESS &&
          Math.max(rr,gg,bb) -
          Math.min(rr,gg,bb) < 55;

        const orange =
          rr > 130 &&
          rr > gg * 1.2 &&
          gg > bb * 1.15;

        if (white || orange) {
          good++;
        }
      }
    }

    if (good >= 5) {
      radius = r;
    }
  }

  ball.radius = radius;

  return ball;
}


/* -------------------------
   스트라이크존 판정
------------------------- */

function isInsideStrikeZone(ball) {

  if (!ball) {
    return false;
  }

  /*
    캔버스는 분석용 240px 크기.

    화면 중앙에 있는 가상의 홈플레이트 영역.
  */

  const zoneLeft =
    canvas.width * 0.34;

  const zoneRight =
    canvas.width * 0.66;

  const zoneTop =
    canvas.height * 0.275;

  const zoneBottom =
    canvas.height * 0.725;

  return (
    ball.x >= zoneLeft &&
    ball.x <= zoneRight &&
    ball.y >= zoneTop &&
    ball.y <= zoneBottom
  );
}


/* -------------------------
   판정
------------------------- */

function makeCall(isStrike) {

  if (!detecting) {
    return;
  }

  detecting = false;

  const now = Date.now();

  if (now - lastResultTime < 1000) {
    return;
  }

  lastResultTime = now;

  if (isStrike) {

    strikeCount++;

    if (strikeCount > 3) {
      strikeCount = 3;
    }

    showResult("STRIKE", "스트라이크");

  } else {

    ballCount++;

    if (ballCount > 4) {
      ballCount = 4;
    }

    showResult("BALL", "볼");

  }

  strikeCountText.textContent = strikeCount;
  ballCountText.textContent = ballCount;

  pitchButton.textContent = "다음 투구";

}


/* -------------------------
   결과 표시 + 음성
------------------------- */

function showResult(text, speech) {

  result.textContent = text;
  result.className = "show";

  try {

    speechSynthesis.cancel();

    const utterance =
      new SpeechSynthesisUtterance(speech);

    utterance.lang = "ko-KR";
    utterance.rate = 1;
    utterance.pitch = 1;

    speechSynthesis.speak(utterance);

  } catch(e) {}

  setTimeout(() => {

    result.className = "";

  }, 1600);

}


/* -------------------------
   카운트 초기화

   길게 누르기 방식
------------------------- */

let pressTimer = null;

document.getElementById("count")
  .addEventListener("pointerdown", () => {

    pressTimer = setTimeout(() => {

      strikeCount = 0;
      ballCount = 0;

      strikeCountText.textContent = "0";
      ballCountText.textContent = "0";

      result.textContent = "";
      result.className = "";

    }, 1200);

  });

document.getElementById("count")
  .addEventListener("pointerup", () => {

    clearTimeout(pressTimer);

  });

document.getElementById("count")
  .addEventListener("pointerleave", () => {

    clearTimeout(pressTimer);

  });


/* -------------------------
   메인 분석 루프
------------------------- */

function loop() {

  requestAnimationFrame(loop);

  if (!detecting) {
    return;
  }

  const ball = findBall();

  if (!ball) {
    return;
  }

  /*
    공이 잡히면 기록
  */

  trajectory.push({
    x: ball.x,
    y: ball.y,
    radius: ball.radius
  });

  /*
    이전 위치 저장
  */

  if (lastBall) {

    const distance =
      Math.hypot(
        ball.x - lastBall.x,
        ball.y - lastBall.y
      );

    /*
      정상적인 공 움직임인지 확인
    */

    if (distance < 80) {
      detectedFrames++;
    }

  } else {

    detectedFrames = 1;

  }

  lastBall = ball;


  /*
    공이 충분히 가까워졌다고 판단되면
    그 순간을 홈플레이트 판정면으로 사용
  */

  if (
    ball.radius >= ARRIVAL_SIZE &&
    detectedFrames >= 2
  ) {

    const strike =
      isInsideStrikeZone(ball);

    makeCall(strike);

  }

}

loop();


/* -------------------------
   다음 투구
------------------------- */

pitchButton.addEventListener("click", () => {

  if (!video.srcObject) {
    return;
  }

  if (!detecting) {

    detecting = true;
    detectedFrames = 0;
    lastBall = null;
    trajectory = [];

    result.className = "";
    result.textContent = "";

    pitchButton.textContent = "공을 던지세요";

  }

});

</script>

</body>
</html>
