<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>야구 심판</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#app {
    width: 100%;
    height: 100%;
    position: relative;
    background: #000;
}

/* 카메라 */

#video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #000;
}

/* 분석용 캔버스 */

#canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

/* 위쪽 카운트 */

#scoreboard {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);

    display: flex;
    gap: 10px;

    z-index: 10;

    background: rgba(0,0,0,0.72);
    padding: 10px 16px;

    border-radius: 18px;

    backdrop-filter: blur(8px);
}

.count {
    min-width: 70px;
    text-align: center;
}

.countTitle {
    font-size: 13px;
    color: #bbb;
    font-weight: bold;
}

.countNumber {
    font-size: 38px;
    line-height: 42px;
    font-weight: 900;
}

/* 판정 결과 */

#result {
    position: absolute;

    left: 50%;
    top: 48%;

    transform: translate(-50%, -50%) scale(0.8);

    font-size: clamp(60px, 18vw, 150px);

    font-weight: 1000;

    text-align: center;

    z-index: 20;

    opacity: 0;

    transition:
        opacity 0.15s ease,
        transform 0.15s ease;

    text-shadow:
        0 5px 20px rgba(0,0,0,0.9);
}

#result.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
}

#result.strike {
    color: #ff334d;
}

#result.ball {
    color: #37e77e;
}

#result.out {
    color: #ff334d;
}

/* 아래 버튼 */

#controls {
    position: absolute;

    left: 50%;
    bottom: 15px;

    transform: translateX(-50%);

    width: min(94%, 500px);

    display: grid;
    grid-template-columns: 1fr 1fr;

    gap: 8px;

    z-index: 30;
}

button {
    border: none;

    border-radius: 14px;

    padding: 14px 8px;

    color: #fff;

    background: rgba(20,20,20,0.85);

    font-size: 16px;
    font-weight: 800;

    backdrop-filter: blur(8px);
}

button:active {
    transform: scale(0.96);
}

#startButton {
    background: #126ee8;
}

#pitchButton {
    background: #e87513;
}

#nextButton {
    background: #168a4a;
}

#resetButton {
    background: #a91e32;
}

/* 상태 */

#status {
    position: absolute;

    left: 50%;
    bottom: 125px;

    transform: translateX(-50%);

    z-index: 20;

    width: 90%;

    text-align: center;

    font-size: 15px;
    font-weight: bold;

    color: #fff;

    text-shadow:
        0 2px 8px #000;

    pointer-events: none;
}

/* 판정면 */

#strikeZone {
    position: absolute;

    left: 50%;
    top: 25%;

    transform: translateX(-50%);

    width: 28%;
    height: 45%;

    border: 3px dashed rgba(255,255,255,0.55);

    z-index: 5;

    pointer-events: none;
}

/* 공 표시 */

#ballPoint {
    position: absolute;

    width: 18px;
    height: 18px;

    border-radius: 50%;

    background: #ffe600;

    border: 3px solid #fff;

    box-shadow:
        0 0 15px #ffe600;

    transform: translate(-50%, -50%);

    display: none;

    z-index: 15;

    pointer-events: none;
}

/* 모바일 */

@media (max-width: 600px) {

    #scoreboard {
        top: 8px;
        padding: 8px 12px;
        gap: 5px;
    }

    .count {
        min-width: 58px;
    }

    .countNumber {
        font-size: 32px;
    }

    .countTitle {
        font-size: 11px;
    }

    #strikeZone {
        width: 38%;
        height: 42%;
        top: 27%;
    }

    #controls {
        bottom: 10px;
    }

    button {
        padding: 13px 6px;
        font-size: 14px;
    }

    #status {
        bottom: 115px;
    }
}
</style>
</head>

<body>

<div id="app">

    <!-- 카메라 -->
    <video
        id="video"
        autoplay
        playsinline
        muted>
    </video>

    <!-- 분석 캔버스 -->
    <canvas id="canvas"></canvas>

    <!-- 스트라이크존 -->
    <div id="strikeZone"></div>

    <!-- 공 위치 -->
    <div id="ballPoint"></div>

    <!-- 카운트 -->
    <div id="scoreboard">

        <div class="count">
            <div class="countTitle">STRIKE</div>
            <div
                id="strikeNumber"
                class="countNumber">
                0
            </div>
        </div>

        <div class="count">
            <div class="countTitle">BALL</div>
            <div
                id="ballNumber"
                class="countNumber">
                0
            </div>
        </div>

    </div>

    <!-- 판정 결과 -->
    <div id="result"></div>

    <!-- 상태 -->
    <div id="status">
        카메라를 시작하세요.
    </div>

    <!-- 버튼 -->
    <div id="controls">

        <button
            id="startButton">
            📷 전면 카메라
        </button>

        <button
            id="voiceButton">
            🔊 음성 ON
        </button>

        <button
            id="pitchButton">
            ⚾ 투구 시작
        </button>

        <button
            id="nextButton">
            ➡️ 다음 투구
        </button>

        <button
            id="resetButton">
            🔄 카운트 초기화
        </button>

    </div>

</div>


<script>

/* =========================
   기본 요소
========================= */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const result =
    document.getElementById("result");

const status =
    document.getElementById("status");

const ballPoint =
    document.getElementById("ballPoint");

const strikeNumber =
    document.getElementById("strikeNumber");

const ballNumber =
    document.getElementById("ballNumber");

const startButton =
    document.getElementById("startButton");

const voiceButton =
    document.getElementById("voiceButton");

const pitchButton =
    document.getElementById("pitchButton");

const nextButton =
    document.getElementById("nextButton");

const resetButton =
    document.getElementById("resetButton");


/* =========================
   상태
========================= */

let stream = null;

let cameraStarted = false;

let pitchActive = false;

let pitchFinished = false;

let voiceEnabled = true;

let strike = 0;

let balls = 0;

let previousBall = null;

let ballHistory = [];

let lastDetectionTime = 0;

let animationFrame = null;


/* =========================
   카메라
========================= */

async function startCamera() {

    try {

        if (stream) {

            stream
                .getTracks()
                .forEach(track => {
                    track.stop();
                });

        }

        status.textContent =
            "전면 카메라를 준비하는 중...";

        stream =
            await navigator.mediaDevices.getUserMedia({

                audio: false,

                video: {

                    facingMode: {
                        ideal: "user"
                    },

                    width: {
                        ideal: 1280
                    },

                    height: {
                        ideal: 720
                    },

                    frameRate: {
                        ideal: 30
                    }

                }

            });

        video.srcObject = stream;

        await video.play();

        cameraStarted = true;

        startButton.textContent =
            "📷 전면 카메라 실행 중";

        status.textContent =
            "카메라 준비 완료";

        resizeCanvas();

        if (!animationFrame) {

            processVideo();

        }

    } catch (error) {

        console.error(error);

        status.textContent =
            "카메라를 사용할 수 없습니다.";

    }

}


/* =========================
   캔버스
========================= */

function resizeCanvas() {

    if (!video.videoWidth)
        return;

    canvas.width =
        video.videoWidth;

    canvas.height =
        video.videoHeight;

}

window.addEventListener(
    "resize",
    resizeCanvas
);


/* =========================
   음성
========================= */

function speak(text) {

    if (!voiceEnabled)
        return;

    if (
        !("speechSynthesis" in window)
    ) {
        return;
    }

    window.speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(text);

    utterance.lang = "ko-KR";

    utterance.rate = 0.9;

    utterance.pitch = 1;

    utterance.volume = 1;

    window.speechSynthesis.speak(
        utterance
    );

}


/* =========================
   음성 버튼
========================= */

voiceButton.addEventListener(
    "click",
    () => {

        voiceEnabled =
            !voiceEnabled;

        if (voiceEnabled) {

            voiceButton.textContent =
                "🔊 음성 ON";

            speak(
                "음성 판정이 켜졌습니다"
            );

        } else {

            voiceButton.textContent =
                "🔇 음성 OFF";

            if (
                "speechSynthesis" in window
            ) {

                speechSynthesis.cancel();

            }

        }

    }
);


/* =========================
   결과 표시
========================= */

function showResult(
    text,
    type
) {

    result.textContent =
        text;

    result.className = "";

    result.classList.add(type);

    void result.offsetWidth;

    result.classList.add("show");

}


/* =========================
   결과 숨기기
========================= */

function hideResult() {

    result.classList.remove(
        "show"
    );

}


/* =========================
   스트라이크
========================= */

function callStrike() {

    if (pitchFinished)
        return;

    pitchFinished = true;

    pitchActive = false;

    strike++;

    strikeNumber.textContent =
        strike;

    showResult(
        "STRIKE!",
        "strike"
    );

    speak(
        "스트라이크"
    );

    status.textContent =
        "스트라이크";

    pitchButton.textContent =
        "⚾ 투구 시작";

    /*
       3스트라이크
    */

    if (strike >= 3) {

        setTimeout(() => {

            showResult(
                "삼진!",
                "out"
            );

            speak(
                "삼진"
            );

        }, 900);

    }

}


/* =========================
   볼
========================= */

function callBall() {

    if (pitchFinished)
        return;

    pitchFinished = true;

    pitchActive = false;

    balls++;

    ballNumber.textContent =
        balls;

    showResult(
        "BALL!",
        "ball"
    );

    speak(
        "볼"
    );

    status.textContent =
        "볼";

    pitchButton.textContent =
        "⚾ 투구 시작";

    /*
       4볼
    */

    if (balls >= 4) {

        setTimeout(() => {

            showResult(
                "볼넷!",
                "ball"
            );

            speak(
                "볼넷"
            );

        }, 900);

    }

}


/* =========================
   투구 시작
========================= */

pitchButton.addEventListener(
    "click",
    () => {

        if (!cameraStarted) {

            status.textContent =
                "먼저 전면 카메라를 켜세요.";

            return;

        }

        startPitch();

    }
);


/* =========================
   투구 초기화
========================= */

function startPitch() {

    pitchActive = true;

    pitchFinished = false;

    previousBall = null;

    ballHistory = [];

    hideResult();

    ballPoint.style.display =
        "none";

    status.textContent =
        "⚾ 투구하세요!";

    pitchButton.textContent =
        "🟢 투구 감지 중";

}


/* =========================
   다음 투구
========================= */

nextButton.addEventListener(
    "click",
    () => {

        startPitch();

    }
);


/* =========================
   카운트 초기화
========================= */

resetButton.addEventListener(
    "click",
    () => {

        strike = 0;

        balls = 0;

        strikeNumber.textContent =
            "0";

        ballNumber.textContent =
            "0";

        pitchActive = false;

        pitchFinished = false;

        previousBall = null;

        ballHistory = [];

        hideResult();

        ballPoint.style.display =
            "none";

        status.textContent =
            "카운트 초기화";

        pitchButton.textContent =
            "⚾ 투구 시작";

    }
);


/* =========================
   공 검출
========================= */

function detectBall() {

    if (
        !video.videoWidth ||
        !video.videoHeight
    ) {
        return null;
    }

    /*
       작은 영상으로 분석
       속도를 위해 해상도 낮춤
    */

    const w = 320;

    const h =
        Math.round(
            w *
            video.videoHeight /
            video.videoWidth
        );

    const temp =
        document.createElement(
            "canvas"
        );

    temp.width = w;
    temp.height = h;

    const tctx =
        temp.getContext(
            "2d",
            {
                willReadFrequently: true
            }
        );

    tctx.drawImage(
        video,
        0,
        0,
        w,
        h
    );

    const image =
        tctx.getImageData(
            0,
            0,
            w,
            h
        );

    const data =
        image.data;

    let candidates = [];

    /*
       밝은 공 후보 찾기
    */

    for (
        let y = 10;
        y < h - 10;
        y += 3
    ) {

        for (
            let x = 10;
            x < w - 10;
            x += 3
        ) {

            const i =
                (y * w + x) * 4;

            const r =
                data[i];

            const g =
                data[i + 1];

            const b =
                data[i + 2];

            const brightness =
                (r + g + b) / 3;

            /*
               흰색/밝은 핑퐁공
            */

            if (
                brightness < 205
            ) {
                continue;
            }

            const difference =
                Math.max(
                    r,
                    g,
                    b
                )
                -
                Math.min(
                    r,
                    g,
                    b
                );

            if (
                difference > 60
            ) {
                continue;
            }

            /*
               주변 밝기
            */

            let count = 0;

            for (
                let dy = -4;
                dy <= 4;
                dy += 2
            ) {

                for (
                    let dx = -4;
                    dx <= 4;
                    dx += 2
                ) {

                    const xx =
                        x + dx;

                    const yy =
                        y + dy;

                    const ii =
                        (yy * w + xx) * 4;

                    const rr =
                        data[ii];

                    const gg =
                        data[ii + 1];

                    const bb =
                        data[ii + 2];

                    const br =
                        (rr + gg + bb)
                        / 3;

                    if (
                        br > 190
                    ) {
                        count++;
                    }

                }

            }

            if (
                count < 7
            ) {
                continue;
            }

            let score =
                count;

            /*
               이전 위치와 가까우면
               점수 추가
            */

            if (previousBall) {

                const px =
                    previousBall.x *
                    w /
                    canvas.width;

                const py =
                    previousBall.y *
                    h /
                    canvas.height;

                const distance =
                    Math.hypot(
                        x - px,
                        y - py
                    );

                if (
                    distance < 60
                ) {

                    score +=
                        40 -
                        distance;

                }

            }

            candidates.push({
                x,
                y,
                score
            });

        }

    }

    if (
        candidates.length === 0
    ) {

        return null;

    }

    candidates.sort(
        (a,b) =>
            b.score -
            a.score
    );

    const best =
        candidates[0];

    const sx =
        canvas.width / w;

    const sy =
        canvas.height / h;

    return {

        x:
            best.x * sx,

        y:
            best.y * sy,

        r:
            6 * sx

    };

}


/* =========================
   판정 영역
========================= */

function getZone() {

    return {

        x:
            window.innerWidth * 0.36,

        y:
            window.innerHeight * 0.25,

        w:
            window.innerWidth * 0.28,

        h:
            window.innerHeight * 0.45

    };

}


/* =========================
   판정
========================= */

function evaluateBall(ball) {

    const zone =
        getZone();

    /*
       공 중심 기준
    */

    const centerInside =

        ball.x >= zone.x &&

        ball.x <=
            zone.x + zone.w &&

        ball.y >= zone.y &&

        ball.y <=
            zone.y + zone.h;

    /*
       공 일부가 존에 걸친 경우
    */

    const closestX =
        Math.max(
            zone.x,
            Math.min(
                ball.x,
                zone.x + zone.w
            )
        );

    const closestY =
        Math.max(
            zone.y,
            Math.min(
                ball.y,
                zone.y + zone.h
            )
        );

    const distance =
        Math.hypot(
            ball.x - closestX,
            ball.y - closestY
        );

    return (
        centerInside ||
        distance <= ball.r
    );

}


/* =========================
   판정면 도착 감지
========================= */

function reachedDecisionPoint(
    ball
) {

    if (
        ballHistory.length < 5
    ) {

        return false;

    }

    const zone =
        getZone();

    /*
       카메라 화면에서
       스트라이크존에 가까워졌을 때
       판정
    */

    const targetX =
        zone.x +
        zone.w / 2;

    const targetY =
        zone.y +
        zone.h * 0.65;

    const distance =
        Math.hypot(
            ball.x - targetX,
            ball.y - targetY
        );

    /*
       충분히 움직인 공만
       판정
    */

    let movement = 0;

    for (
        let i = 1;
        i < ballHistory.length;
        i++
    ) {

        movement +=
            Math.hypot(

                ballHistory[i].x -
                ballHistory[i-1].x,

                ballHistory[i].y -
                ballHistory[i-1].y

            );

    }

    if (
        movement < 20
    ) {

        return false;

    }

    /*
       판정 영역 근처
    */

    const maxDistance =
        Math.min(
            window.innerWidth,
            window.innerHeight
        ) * 0.32;

    return (
        distance <
        maxDistance
    );

}


/* =========================
   영상 처리
========================= */

function processVideo() {

    animationFrame =
        requestAnimationFrame(
            processVideo
        );

    if (
        !cameraStarted
    ) {

        return;

    }

    if (
        video.readyState < 2
    ) {

        return;

    }

    if (
        pitchActive &&
        !pitchFinished
    ) {

        const now =
            performance.now();

        /*
           너무 자주 분석하지 않음
        */

        if (
            now - lastDetectionTime
            > 50
        ) {

            lastDetectionTime =
                now;

            const ball =
                detectBall();

            if (ball) {

                previousBall =
                    ball;

                ballHistory.push(
                    ball
                );

                if (
                    ballHistory.length >
                    20
                ) {

                    ballHistory.shift();

                }

                /*
                   화면에 공 위치 표시
                */

                ballPoint.style.display =
                    "block";

                ballPoint.style.left =
                    (
                        ball.x /
                        canvas.width *
                        100
                    ) + "%";

                ballPoint.style.top =
                    (
                        ball.y /
                        canvas.height *
                        100
                    ) + "%";


                /*
                   판정
                */

                if (
                    reachedDecisionPoint(
                        ball
                    )
                ) {

                    if (
                        evaluateBall(
                            ball
                        )
                    ) {

                        callStrike();

                    } else {

                        callBall();

                    }

                }

            }

        }

    }

}


/* =========================
   시작 버튼
========================= */

startButton.addEventListener(
    "click",
    () => {

        startCamera();

    }
);


/* =========================
   시작
========================= */

resizeCanvas();

</script>

</body>
</html>
