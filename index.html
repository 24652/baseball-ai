<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>AI 야구 심판</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background: #080b10;
  color: white;
  font-family: Arial, sans-serif;
  overflow-x: hidden;
}

#app {
  max-width: 900px;
  margin: auto;
  padding: 12px;
}

h1 {
  margin: 4px 0 12px;
  text-align: center;
  font-size: 25px;
}

.panel {
  background: #121720;
  border: 1px solid #26303d;
  border-radius: 16px;
  padding: 12px;
  margin-bottom: 12px;
}

.cameraBox {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #000;
  border-radius: 14px;
  overflow: hidden;
}

#video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

#canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

#result {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%,-50%);
  font-size: clamp(42px,12vw,100px);
  font-weight: 900;
  text-shadow: 0 4px 20px #000;
  opacity: 0;
  transition: opacity .2s, transform .2s;
  pointer-events: none;
  z-index: 10;
  white-space: nowrap;
}

#result.show {
  opacity: 1;
  transform: translate(-50%,-50%) scale(1.05);
}

#result.strike {
  color: #ff334d;
}

#result.ball {
  color: #37d978;
}

#status {
  margin-top: 10px;
  text-align: center;
  font-size: 15px;
  color: #b7c1cf;
}

.buttons {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 8px;
}

button {
  border: 0;
  border-radius: 12px;
  padding: 13px 10px;
  background: #263244;
  color: white;
  font-size: 15px;
  font-weight: 700;
}

button:active {
  transform: scale(.97);
}

button.primary {
  background: #1769e0;
}

button.green {
  background: #16844a;
}

button.red {
  background: #b82439;
}

button.orange {
  background: #bd6d16;
}

.score {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 10px;
}

.scoreBox {
  background: #0d1118;
  border-radius: 14px;
  padding: 12px;
  text-align: center;
}

.scoreTitle {
  color: #9ca8b8;
  font-size: 14px;
}

.scoreNumber {
  font-size: 36px;
  font-weight: 900;
  margin-top: 4px;
}

.range {
  margin-top: 12px;
}

.range label {
  display: flex;
  justify-content: space-between;
  font-size: 14px;
  color: #c9d2df;
  margin-bottom: 5px;
}

input[type=range] {
  width: 100%;
}

.info {
  color: #9da8b8;
  font-size: 13px;
  line-height: 1.5;
}

#log {
  max-height: 130px;
  overflow-y: auto;
  font-size: 13px;
}

.logItem {
  padding: 6px 4px;
  border-bottom: 1px solid #202834;
}

.strikeText {
  color: #ff5266;
  font-weight: bold;
}

.ballText {
  color: #43e38a;
  font-weight: bold;
}

.hidden {
  display: none;
}

@media(max-width:500px) {
  #app {
    padding: 8px;
  }

  h1 {
    font-size: 22px;
  }

  button {
    font-size: 14px;
    padding: 12px 7px;
  }
}
</style>
</head>

<body>

<div id="app">

  <h1>⚾ AI 야구 심판</h1>

  <div class="panel">

    <div class="score">
      <div class="scoreBox">
        <div class="scoreTitle">STRIKE</div>
        <div id="strikeCount" class="scoreNumber">0</div>
      </div>

      <div class="scoreBox">
        <div class="scoreTitle">BALL</div>
        <div id="ballCount" class="scoreNumber">0</div>
      </div>
    </div>

    <div class="cameraBox">

      <video
        id="video"
        autoplay
        playsinline
        muted>
      </video>

      <canvas id="canvas"></canvas>

      <div id="result"></div>

    </div>

    <div id="status">
      카메라를 시작하세요.
    </div>

  </div>

  <div class="panel">

    <div class="buttons">

      <button
        id="cameraBtn"
        class="primary">
        📷 전면 카메라 시작
      </button>

      <button
        id="switchBtn">
        🔄 카메라 전환
      </button>

      <button
        id="voiceBtn"
        class="green">
        🔊 음성 ON
      </button>

      <button
        id="pitchBtn"
        class="orange">
        ⚾ 투구 시작
      </button>

      <button
        id="nextBtn"
        class="primary">
        ➡️ 다음 투구
      </button>

      <button
        id="resetBtn"
        class="red">
        🔄 카운트 초기화
      </button>

    </div>

  </div>

  <div class="panel">

    <h3>🎯 스트라이크존 설정</h3>

    <div class="range">

      <label>
        <span>좌우 위치</span>
        <span id="zoneXValue">50%</span>
      </label>

      <input
        id="zoneX"
        type="range"
        min="10"
        max="90"
        value="50">

    </div>

    <div class="range">

      <label>
        <span>위치</span>
        <span id="zoneYValue">25%</span>
      </label>

      <input
        id="zoneY"
        type="range"
        min="5"
        max="60"
        value="25">

    </div>

    <div class="range">

      <label>
        <span>존 너비</span>
        <span id="zoneWValue">24%</span>
      </label>

      <input
        id="zoneW"
        type="range"
        min="12"
        max="45"
        value="24">

    </div>

    <div class="range">

      <label>
        <span>존 높이</span>
        <span id="zoneHValue">42%</span>
      </label>

      <input
        id="zoneH"
        type="range"
        min="20"
        max="60"
        value="42">

    </div>

    <p class="info">
      카메라를 고정한 상태에서 실제 타자의 몸에 맞게
      스트라이크존을 조절하세요.
    </p>

  </div>

  <div class="panel">

    <h3>🎯 가상 판정면</h3>

    <div class="range">

      <label>
        <span>판정 거리</span>
        <span id="depthValue">100%</span>
      </label>

      <input
        id="depth"
        type="range"
        min="60"
        max="140"
        value="100">

    </div>

    <p class="info">
      공이 카메라에 완전히 도착한 마지막 프레임이 아니라,
      설정된 가상 판정면에 도달했다고 판단되는 순간에 판정합니다.
      정확도를 높이려면 카메라 위치를 고정하세요.
    </p>

  </div>

  <div class="panel">

    <h3>📋 판정 기록</h3>

    <div id="log">
      아직 판정 기록이 없습니다.
    </div>

  </div>

</div>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const result = document.getElementById("result");
const statusText = document.getElementById("status");

const cameraBtn = document.getElementById("cameraBtn");
const switchBtn = document.getElementById("switchBtn");
const voiceBtn = document.getElementById("voiceBtn");
const pitchBtn = document.getElementById("pitchBtn");
const nextBtn = document.getElementById("nextBtn");
const resetBtn = document.getElementById("resetBtn");

const strikeCountEl = document.getElementById("strikeCount");
const ballCountEl = document.getElementById("ballCount");

const logEl = document.getElementById("log");

let stream = null;

let cameraStarted = false;

let facingMode = "user";

let tracking = false;

let pitchActive = false;

let voiceEnabled = false;

let strikeCount = 0;
let ballCount = 0;

let lastBall = null;

let ballHistory = [];

let lastPitchTime = 0;

let pitchResultGiven = false;

let animationId = null;


/* =========================
   스트라이크존
========================= */

let zone = {
  x: 0.50,
  y: 0.25,
  w: 0.24,
  h: 0.42
};


/* =========================
   판정 거리
========================= */

let depthFactor = 1.0;


/* =========================
   카메라 시작
========================= */

async function startCamera() {

  try {

    if (stream) {

      stream.getTracks().forEach(track => track.stop());

    }

    statusText.textContent =
      "카메라를 준비하는 중...";

    let constraints = {

      audio: false,

      video: {

        facingMode: {
          ideal: facingMode
        },

        width: {
          ideal: 1280
        },

        height: {
          ideal: 720
        },

        frameRate: {
          ideal: 30,
          max: 30
        }

      }

    };

    stream =
      await navigator.mediaDevices.getUserMedia(
        constraints
      );

    video.srcObject = stream;

    await video.play();

    cameraStarted = true;

    cameraBtn.textContent =
      facingMode === "user"
      ? "📷 전면 카메라 실행 중"
      : "📷 후면 카메라 실행 중";

    statusText.textContent =
      "카메라 준비 완료. 스트라이크존을 맞춰주세요.";

    resizeCanvas();

    if (!animationId) {
      processVideo();
    }

  } catch (error) {

    console.error(error);

    statusText.textContent =
      "카메라를 사용할 수 없습니다. 브라우저 권한을 확인하세요.";

  }

}


/* =========================
   카메라 전환
========================= */

switchBtn.addEventListener("click", async () => {

  facingMode =
    facingMode === "user"
    ? "environment"
    : "user";

  await startCamera();

});


/* =========================
   캔버스 크기
========================= */

function resizeCanvas() {

  if (!video.videoWidth) return;

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

}

window.addEventListener(
  "resize",
  resizeCanvas
);


/* =========================
   스트라이크존 좌표
========================= */

function getZone() {

  const w = canvas.width;
  const h = canvas.height;

  const zw = w * zone.w;
  const zh = h * zone.h;

  const zx =
    w * zone.x - zw / 2;

  const zy =
    h * zone.y;

  return {
    x: zx,
    y: zy,
    w: zw,
    h: zh
  };

}


/* =========================
   화면 그리기
========================= */

function drawOverlay() {

  if (!canvas.width || !canvas.height)
    return;

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  const z = getZone();

  /*
   스트라이크존
  */

  ctx.save();

  ctx.strokeStyle =
    "rgba(255,80,80,.95)";

  ctx.lineWidth = 5;

  ctx.setLineDash([
    12,
    8
  ]);

  ctx.strokeRect(
    z.x,
    z.y,
    z.w,
    z.h
  );

  ctx.setLineDash([]);

  ctx.fillStyle =
    "rgba(255,60,60,.08)";

  ctx.fillRect(
    z.x,
    z.y,
    z.w,
    z.h
  );

  /*
   가상 판정면
  */

  ctx.strokeStyle =
    "rgba(60,180,255,.9)";

  ctx.lineWidth = 3;

  ctx.beginPath();

  ctx.moveTo(
    z.x,
    z.y + z.h
  );

  ctx.lineTo(
    z.x + z.w,
    z.y + z.h
  );

  ctx.stroke();

  ctx.fillStyle =
    "rgba(60,180,255,.95)";

  ctx.font =
    `${Math.max(14,canvas.width*0.018)}px Arial`;

  ctx.fillText(
    "가상 판정면",
    z.x,
    z.y + z.h + 28
  );

  ctx.restore();


  /*
   공 궤적
  */

  if (ballHistory.length > 1) {

    ctx.save();

    ctx.strokeStyle =
      "rgba(255,220,60,.95)";

    ctx.lineWidth = 4;

    ctx.beginPath();

    for (
      let i = 0;
      i < ballHistory.length;
      i++
    ) {

      const p =
        ballHistory[i];

      if (i === 0) {

        ctx.moveTo(
          p.x,
          p.y
        );

      } else {

        ctx.lineTo(
          p.x,
          p.y
        );

      }

    }

    ctx.stroke();

    ctx.restore();

  }


  /*
   현재 공
  */

  if (lastBall) {

    ctx.save();

    ctx.beginPath();

    ctx.arc(
      lastBall.x,
      lastBall.y,
      Math.max(
        7,
        lastBall.r
      ),
      0,
      Math.PI * 2
    );

    ctx.strokeStyle =
      "#fff";

    ctx.lineWidth = 3;

    ctx.stroke();

    ctx.restore();

  }

}


/* =========================
   간단한 공 검출
========================= */

function detectBall() {

  if (
    !video.videoWidth ||
    !video.videoHeight
  ) {
    return null;
  }

  const w = 320;

  const h =
    Math.round(
      w *
      video.videoHeight /
      video.videoWidth
    );

  const smallCanvas =
    document.createElement("canvas");

  smallCanvas.width = w;
  smallCanvas.height = h;

  const smallCtx =
    smallCanvas.getContext("2d", {
      willReadFrequently: true
    });

  smallCtx.drawImage(
    video,
    0,
    0,
    w,
    h
  );

  const image =
    smallCtx.getImageData(
      0,
      0,
      w,
      h
    );

  const data =
    image.data;

  let best = null;

  /*
   너무 어두운 가장자리 등을
   조금 줄여서 탐색
  */

  for (
    let y = 15;
    y < h - 15;
    y += 3
  ) {

    for (
      let x = 15;
      x < w - 15;
      x += 3
    ) {

      const i =
        (y * w + x) * 4;

      const r = data[i];
      const g = data[i + 1];
      const b = data[i + 2];

      const brightness =
        (r + g + b) / 3;

      /*
       밝은 공 후보
      */

      if (brightness < 190)
        continue;

      /*
       흰색/밝은 공
      */

      const neutral =
        Math.max(r,g,b)
        -
        Math.min(r,g,b);

      if (neutral > 70)
        continue;

      /*
       주변 밝기 확인
      */

      let brightCount = 0;

      for (
        let dy = -4;
        dy <= 4;
        dy += 2
      ) {

        for (
          let dx = -4;
          dx <= 4;
          dx += 2
        ) {

          const xx = x + dx;
          const yy = y + dy;

          const ii =
            (yy * w + xx) * 4;

          const rr = data[ii];
          const gg = data[ii + 1];
          const bb = data[ii + 2];

          const br =
            (rr + gg + bb) / 3;

          if (br > 180)
            brightCount++;

        }

      }

      if (brightCount < 6)
        continue;

      /*
       이전 공과 가까운 후보 우선
      */

      let distanceScore = 0;

      if (lastBall) {

        const px =
          lastBall.x *
          w /
          canvas.width;

        const py =
          lastBall.y *
          h /
          canvas.height;

        const d =
          Math.hypot(
            x - px,
            y - py
          );

        distanceScore =
          Math.max(
            0,
            60 - d
          );

      }

      const score =
        brightCount * 5
        +
        brightness / 20
        +
        distanceScore;

      if (
        !best ||
        score > best.score
      ) {

        best = {
          x: x,
          y: y,
          score: score
        };

      }

    }

  }

  if (!best)
    return null;

  const scaleX =
    canvas.width / w;

  const scaleY =
    canvas.height / h;

  /*
   공 크기 추정
  */

  let radius =
    5 * scaleX;

  return {

    x: best.x * scaleX,

    y: best.y * scaleY,

    r: radius

  };

}


/* =========================
   공이 판정면에 도착했는지
========================= */

function reachedPlate(ball) {

  if (
    !ballHistory.length ||
    ballHistory.length < 4
  ) {
    return false;
  }

  /*
   공이 카메라 쪽으로 오면서
   화면상 크기가 커지는 것을
   이용한 간단한 깊이 추정
  */

  const recent =
    ballHistory.slice(-5);

  let movement = 0;

  for (
    let i = 1;
    i < recent.length;
    i++
  ) {

    movement +=
      Math.hypot(
        recent[i].x -
        recent[i-1].x,

        recent[i].y -
        recent[i-1].y
      );

  }

  /*
   충분히 움직였어야 함
  */

  if (movement < 10)
    return false;

  /*
   화면 중앙/하단 쪽으로
   접근하는 투구라고 가정
  */

  const centerX =
    canvas.width / 2;

  const centerY =
    canvas.height * 0.55;

  const distance =
    Math.hypot(
      ball.x - centerX,
      ball.y - centerY
    );

  /*
   판정면 근처에서 판정
  */

  const maxDistance =
    canvas.width *
    0.45 *
    depthFactor;

  if (distance > maxDistance)
    return false;

  /*
   공의 위치가 최근 프레임보다
   카메라 방향으로 접근하는지
  */

  if (
    recent.length >= 3
  ) {

    const old =
      recent[0];

    const newest =
      recent[recent.length - 1];

    const oldDist =
      Math.hypot(
        old.x - centerX,
        old.y - centerY
      );

    const newDist =
      Math.hypot(
        newest.x - centerX,
        newest.y - centerY
      );

    if (newDist > oldDist + 5)
      return false;

  }

  /*
   판정면을 조금 앞쪽에 둠
  */

  const triggerY =
    canvas.height *
    0.78;

  /*
   전면카메라에서는 공이
   아래쪽으로 접근하는 경우가
   많기 때문에 보조 조건으로 사용
  */

  if (
    ball.y > triggerY
  ) {
    return true;
  }

  return false;

}


/* =========================
   스트라이크 판정
========================= */

function isStrike(ball) {

  const z =
    getZone();

  /*
   공 중심이 존 안에 있는지
  */

  const inside =
    ball.x >= z.x &&
    ball.x <= z.x + z.w &&
    ball.y >= z.y &&
    ball.y <= z.y + z.h;

  /*
   공의 일부가 존에 걸쳐도
   스트라이크로 인정
  */

  if (inside)
    return true;

  const closestX =
    Math.max(
      z.x,
      Math.min(
        ball.x,
        z.x + z.w
      )
    );

  const closestY =
    Math.max(
      z.y,
      Math.min(
        ball.y,
        z.y + z.h
      )
    );

  const distance =
    Math.hypot(
      ball.x - closestX,
      ball.y - closestY
    );

  return distance <= ball.r;

}


/* =========================
   판정 실행
========================= */

function makeCall(ball) {

  if (pitchResultGiven)
    return;

  pitchResultGiven = true;

  const strike =
    isStrike(ball);

  if (strike) {

    strikeCount++;

    strikeCountEl.textContent =
      strikeCount;

    showResult(
      "STRIKE!",
      "strike"
    );

    speak(
      "스트라이크"
    );

    addLog(
      "STRIKE"
    );

    statusText.textContent =
      "🔴 스트라이크!";

  } else {

    ballCount++;

    ballCountEl.textContent =
      ballCount;

    showResult(
      "BALL!",
      "ball"
    );

    speak(
      "볼"
    );

    addLog(
      "BALL"
    );

    statusText.textContent =
      "🟢 볼!";

  }

}


/* =========================
   화면 결과
========================= */

function showResult(
  text,
  type
) {

  result.textContent =
    text;

  result.className =
    "";

  result.classList.add(
    type
  );

  /*
   reflow
  */

  void result.offsetWidth;

  result.classList.add(
    "show"
  );

}


/* =========================
   음성
========================= */

function speak(text) {

  if (!voiceEnabled)
    return;

  if (
    !("speechSynthesis" in window)
  ) {
    return;
  }

  try {

    window.speechSynthesis.cancel();

    const utterance =
      new SpeechSynthesisUtterance(
        text
      );

    utterance.lang =
      "ko-KR";

    utterance.rate =
      0.95;

    utterance.pitch =
      1.0;

    utterance.volume =
      1.0;

    window.speechSynthesis.speak(
      utterance
    );

  } catch (e) {

    console.log(e);

  }

}


/* =========================
   음성 버튼
========================= */

voiceBtn.addEventListener(
  "click",
  () => {

    voiceEnabled =
      !voiceEnabled;

    if (voiceEnabled) {

      voiceBtn.textContent =
        "🔊 음성 ON";

      voiceBtn.className =
        "green";

      /*
       iPhone에서 음성 권한을
       먼저 활성화하기 위한 테스트
      */

      speak(
        "음성 판정이 켜졌습니다"
      );

    } else {

      voiceBtn.textContent =
        "🔇 음성 OFF";

      voiceBtn.className =
        "";

      if (
        "speechSynthesis" in window
      ) {

        window.speechSynthesis.cancel();

      }

    }

  }
);


/* =========================
   투구 시작
========================= */

pitchBtn.addEventListener(
  "click",
  () => {

    if (!cameraStarted) {

      statusText.textContent =
        "먼저 카메라를 시작하세요.";

      return;

    }

    startPitch();

  }
);


/* =========================
   투구 시작 함수
========================= */

function startPitch() {

  pitchActive = true;

  pitchResultGiven = false;

  ballHistory = [];

  lastBall = null;

  result.classList.remove(
    "show"
  );

  statusText.textContent =
    "⚾ 투구하세요!";

  pitchBtn.textContent =
    "🟢 투구 감지 중";

}


/* =========================
   다음 투구
========================= */

nextBtn.addEventListener(
  "click",
  () => {

    startPitch();

  }
);


/* =========================
   카운트 초기화
========================= */

resetBtn.addEventListener(
  "click",
  () => {

    strikeCount = 0;

    ballCount = 0;

    strikeCountEl.textContent =
      "0";

    ballCountEl.textContent =
      "0";

    result.classList.remove(
      "show"
    );

    logEl.innerHTML =
      "아직 판정 기록이 없습니다.";

    pitchResultGiven = false;

    ballHistory = [];

    lastBall = null;

    statusText.textContent =
      "카운트를 초기화했습니다.";

  }
);


/* =========================
   판정 기록
========================= */

function addLog(type) {

  if (
    logEl.textContent ===
    "아직 판정 기록이 없습니다."
  ) {

    logEl.innerHTML = "";

  }

  const item =
    document.createElement("div");

  item.className =
    "logItem";

  const time =
    new Date().toLocaleTimeString(
      "ko-KR",
      {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      }
    );

  if (type === "STRIKE") {

    item.innerHTML =
      `${time} — <span class="strikeText">STRIKE</span>`;

  } else {

    item.innerHTML =
      `${time} — <span class="ballText">BALL</span>`;

  }

  logEl.prepend(item);

}


/* =========================
   영상 처리
========================= */

function processVideo() {

  animationId =
    requestAnimationFrame(
      processVideo
    );

  if (
    !cameraStarted ||
    video.readyState < 2
  ) {

    drawOverlay();

    return;

  }

  /*
   투구 중일 때만 추적
  */

  if (
    pitchActive &&
    !pitchResultGiven
  ) {

    const ball =
      detectBall();

    if (ball) {

      lastBall = ball;

      ballHistory.push(ball);

      /*
       너무 오래 저장하지 않음
      */

      if (
        ballHistory.length > 25
      ) {

        ballHistory.shift();

      }

      if (
        reachedPlate(ball)
      ) {

        makeCall(ball);

        pitchActive = false;

        pitchBtn.textContent =
          "⚾ 투구 시작";

      }

    }

  }

  drawOverlay();

}


/* =========================
   스트라이크존 슬라이더
========================= */

const zoneX =
  document.getElementById(
    "zoneX"
  );

const zoneY =
  document.getElementById(
    "zoneY"
  );

const zoneW =
  document.getElementById(
    "zoneW"
  );

const zoneH =
  document.getElementById(
    "zoneH"
  );

const depth =
  document.getElementById(
    "depth"
  );


function updateZone() {

  zone.x =
    Number(zoneX.value) / 100;

  zone.y =
    Number(zoneY.value) / 100;

  zone.w =
    Number(zoneW.value) / 100;

  zone.h =
    Number(zoneH.value) / 100;

  document.getElementById(
    "zoneXValue"
  ).textContent =
    zoneX.value + "%";

  document.getElementById(
    "zoneYValue"
  ).textContent =
    zoneY.value + "%";

  document.getElementById(
    "zoneWValue"
  ).textContent =
    zoneW.value + "%";

  document.getElementById(
    "zoneHValue"
  ).textContent =
    zoneH.value + "%";

}


[
  zoneX,
  zoneY,
  zoneW,
  zoneH
].forEach(
  el => {

    el.addEventListener(
      "input",
      updateZone
    );

  }
);


/* =========================
   판정 거리
========================= */

depth.addEventListener(
  "input",
  () => {

    depthFactor =
      Number(depth.value) / 100;

    document.getElementById(
      "depthValue"
    ).textContent =
      depth.value + "%";

  }
);


/* =========================
   카메라 버튼
========================= */

cameraBtn.addEventListener(
  "click",
  () => {

    startCamera();

  }
);


/* =========================
   초기화
========================= */

updateZone();

</script>
