<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>야구 AI 심판</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

#app {
    position: relative;
    width: 100%;
    height: 100%;
    background: #000;
}

/* 카메라 */

#video {
    position: absolute;
    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    transform: scaleX(-1);
}

/* 공 궤적 */

#overlay {
    position: absolute;
    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    z-index: 5;

    pointer-events: none;

    transform: scaleX(-1);
}

/* 카운트 */

#score {
    position: absolute;

    top: 15px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 20;

    background: rgba(0,0,0,.75);

    color: white;

    padding: 10px 22px;

    border-radius: 15px;

    font-size: 24px;
    font-weight: bold;
}

/* 결과 */

#result {

    position: absolute;

    left: 50%;
    top: 18%;

    transform: translate(-50%,-50%);

    z-index: 30;

    color: white;

    font-size: clamp(55px,15vw,110px);

    font-weight: 900;

    text-shadow:
        0 4px 15px #000,
        0 0 25px #000;

    display: none;

    white-space: nowrap;
}

/* 스트라이크존 */

#zone {

    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%,-50%);

    width: min(70vw,420px);
    height: min(70vw,420px);

    z-index: 10;

    display: grid;

    grid-template-columns: repeat(3,1fr);
    grid-template-rows: repeat(3,1fr);

    border: 3px solid rgba(255,255,255,.9);

    pointer-events: none;
}

/* 9칸 */

.cell {

    border: 1px solid rgba(255,255,255,.75);

}

/* 판정선 */

#decisionLine {

    position: absolute;

    left: 0;
    width: 100%;

    height: 2px;

    background: rgba(255,80,80,.8);

    z-index: 12;

    pointer-events: none;
}

/* 아래 버튼 */

#bottom {

    position: absolute;

    left: 50%;
    bottom: 20px;

    transform: translateX(-50%);

    z-index: 40;

    display: flex;

    gap: 10px;
}

button {

    border: none;

    border-radius: 12px;

    padding: 13px 20px;

    font-size: 17px;

    font-weight: bold;

    background: white;

    color: black;

}

/* 시작 화면 */

#start {

    position: absolute;

    inset: 0;

    z-index: 100;

    background: #080808;

    color: white;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;
}

#start h1 {

    font-size: 34px;

    margin-bottom: 25px;

}

#start button {

    font-size: 21px;

    padding: 16px 30px;

}

</style>
</head>

<body>

<div id="app">

    <video
        id="video"
        autoplay
        playsinline
        muted>
    </video>

    <canvas id="overlay"></canvas>

    <div id="score">

        S <span id="strike">0</span>

        &nbsp;&nbsp;

        B <span id="ball">0</span>

    </div>

    <div id="result"></div>

    <!-- 9칸 스트라이크존 -->

    <div id="zone">

        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>

        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>

        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>

    </div>

    <div id="decisionLine"></div>

    <div id="bottom">

        <button id="pitchButton">
            투구 시작
        </button>

        <button id="resetButton">
            초기화
        </button>

    </div>

    <div id="start">

        <h1>⚾ AI 야구 심판</h1>

        <button id="startButton">
            카메라 시작
        </button>

    </div>

</div>


<script>

/* =========================================
   기본 변수
========================================= */

const video =
    document.getElementById("video");

const overlay =
    document.getElementById("overlay");

const ctx =
    overlay.getContext("2d");

const startScreen =
    document.getElementById("start");

const startButton =
    document.getElementById("startButton");

const pitchButton =
    document.getElementById("pitchButton");

const resetButton =
    document.getElementById("resetButton");

const result =
    document.getElementById("result");

const strikeText =
    document.getElementById("strike");

const ballText =
    document.getElementById("ball");

const zone =
    document.getElementById("zone");

const decisionLine =
    document.getElementById("decisionLine");


let stream = null;


/* =========================================
   카운트
========================================= */

let strikes = 0;
let balls = 0;


/* =========================================
   공 추적 상태
========================================= */

let tracking = false;

let ballHistory = [];

let lastBall = null;

let framesSinceStart = 0;

let hasJudged = false;


/* =========================================
   분석용 캔버스
========================================= */

const analysisCanvas =
    document.createElement("canvas");

const analysisCtx =
    analysisCanvas.getContext(
        "2d",
        {
            willReadFrequently: true
        }
    );

const ANALYSIS_WIDTH = 320;
const ANALYSIS_HEIGHT = 240;

analysisCanvas.width =
    ANALYSIS_WIDTH;

analysisCanvas.height =
    ANALYSIS_HEIGHT;


/* 이전 프레임 */

let previousFrame = null;


/* =========================================
   카메라 시작
========================================= */

startButton.addEventListener(
    "click",
    async () => {

        try {

            stream =
                await navigator.mediaDevices
                .getUserMedia({

                    video: {

                        facingMode: {
                            ideal: "user"
                        },

                        width: {
                            ideal: 1280
                        },

                        height: {
                            ideal: 720
                        }

                    },

                    audio: false

                });

            video.srcObject = stream;

            await video.play();

            startScreen.style.display =
                "none";

            resize();

        }

        catch (error) {

            alert(
                "카메라를 사용할 수 없습니다.\n\n" +
                "브라우저에서 카메라 권한을 허용해주세요."
            );

            console.error(error);

        }

    }
);


/* =========================================
   화면 크기
========================================= */

function resize() {

    overlay.width =
        window.innerWidth;

    overlay.height =
        window.innerHeight;

    updateDecisionLine();

}


window.addEventListener(
    "resize",
    resize
);


/* =========================================
   판정선
========================================= */

function updateDecisionLine() {

    const zoneRect =
        zone.getBoundingClientRect();

    /*
      스트라이크존 아래쪽을
      가상의 홈플레이트 판정면으로 사용
    */

    const y =
        zoneRect.bottom;

    decisionLine.style.top =
        y + "px";

}


/* =========================================
   투구 시작
========================================= */

pitchButton.addEventListener(
    "click",
    () => {

        if (!video.srcObject) {
            return;
        }

        if (tracking) {
            return;
        }

        tracking = true;

        hasJudged = false;

        framesSinceStart = 0;

        lastBall = null;

        ballHistory = [];

        previousFrame = null;

        result.style.display =
            "none";

        pitchButton.textContent =
            "공 추적 중";

    }
);


/* =========================================
   공 후보 찾기
========================================= */

function findBall() {

    analysisCtx.drawImage(
        video,
        0,
        0,
        ANALYSIS_WIDTH,
        ANALYSIS_HEIGHT
    );

    const frame =
        analysisCtx.getImageData(
            0,
            0,
            ANALYSIS_WIDTH,
            ANALYSIS_HEIGHT
        );

    const data =
        frame.data;


    /*
      첫 프레임이면
      움직임 비교만 준비
    */

    if (!previousFrame) {

        previousFrame =
            new Uint8ClampedArray(data);

        return null;

    }


    let best = null;

    let bestScore = 0;


    /*
      전체 화면을 검사

      밝은 공 + 움직임을 같이 사용
    */

    for (
        let y = 5;
        y < ANALYSIS_HEIGHT - 5;
        y += 3
    ) {

        for (
            let x = 5;
            x < ANALYSIS_WIDTH - 5;
            x += 3
        ) {

            const i =
                (y * ANALYSIS_WIDTH + x) * 4;


            const r =
                data[i];

            const g =
                data[i + 1];

            const b =
                data[i + 2];


            const oldR =
                previousFrame[i];

            const oldG =
                previousFrame[i + 1];

            const oldB =
                previousFrame[i + 2];


            const brightness =
                (r + g + b) / 3;


            const oldBrightness =
                (oldR + oldG + oldB) / 3;


            const movement =
                Math.abs(
                    brightness -
                    oldBrightness
                );


            /*
              흰색 공
            */

            const white =
                brightness > 165 &&
                Math.max(r,g,b) -
                Math.min(r,g,b) < 55;


            /*
              주황/노란 탁구공
            */

            const orange =
                r > 140 &&
                g > 70 &&
                r > g * 1.25 &&
                g > b * 1.15;


            if (!white && !orange) {
                continue;
            }


            /*
              움직임이 있어야 공 후보
            */

            if (movement < 18) {
                continue;
            }


            /*
              주변 픽셀 검사
            */

            let surrounding = 0;

            for (
                let yy = -5;
                yy <= 5;
                yy += 2
            ) {

                for (
                    let xx = -5;
                    xx <= 5;
                    xx += 2
                ) {

                    const nx = x + xx;
                    const ny = y + yy;


                    if (
                        nx < 0 ||
                        ny < 0 ||
                        nx >= ANALYSIS_WIDTH ||
                        ny >= ANALYSIS_HEIGHT
                    ) {
                        continue;
                    }


                    const ni =
                        (
                            ny *
                            ANALYSIS_WIDTH +
                            nx
                        ) * 4;


                    const nr =
                        data[ni];

                    const ng =
                        data[ni + 1];

                    const nb =
                        data[ni + 2];


                    const nbri =
                        (nr + ng + nb) / 3;


                    const nwhite =
                        nbri > 155 &&
                        Math.max(nr,ng,nb) -
                        Math.min(nr,ng,nb) < 65;


                    const norange =
                        nr > 130 &&
                        ng > 65 &&
                        nr > ng * 1.2;


                    if (
                        nwhite ||
                        norange
                    ) {

                        surrounding++;

                    }

                }

            }


            /*
              공처럼 어느 정도
              뭉쳐 있는 후보만 사용
            */

            if (surrounding < 5) {
                continue;
            }


            let score =
                movement +
                surrounding * 3;


            /*
              이전 공 위치와 가까운 후보에
              점수를 더 줌
            */

            if (lastBall) {

                const dx =
                    x - lastBall.x;

                const dy =
                    y - lastBall.y;

                const distance =
                    Math.sqrt(
                        dx * dx +
                        dy * dy
                    );


                if (distance < 50) {

                    score +=
                        60 - distance;

                }

            }


            if (score > bestScore) {

                bestScore = score;

                best = {

                    x: x,
                    y: y,

                    radius: 5

                };

            }

        }

    }


    previousFrame =
        new Uint8ClampedArray(data);


    return best;

}


/* =========================================
   분석 좌표 → 화면 좌표
========================================= */

function screenPosition(ball) {

    const x =
        ball.x /
        ANALYSIS_WIDTH *
        overlay.width;

    const y =
        ball.y /
        ANALYSIS_HEIGHT *
        overlay.height;

    return {
        x,
        y
    };

}


/* =========================================
   궤적 그리기
========================================= */

function drawTracking() {

    ctx.clearRect(
        0,
        0,
        overlay.width,
        overlay.height
    );


    if (ballHistory.length < 1) {
        return;
    }


    /*
      궤적
    */

    ctx.beginPath();

    ballHistory.forEach(
        (ball, index) => {

            const p =
                screenPosition(ball);

            if (index === 0) {

                ctx.moveTo(
                    p.x,
                    p.y
                );

            }
            else {

                ctx.lineTo(
                    p.x,
                    p.y
                );

            }

        }
    );


    ctx.lineWidth = 4;

    ctx.strokeStyle =
        "rgba(255,255,0,.9)";

    ctx.stroke();


    /*
      현재 공
    */

    const current =
        screenPosition(
            ballHistory[
                ballHistory.length - 1
            ]
        );


    ctx.beginPath();

    ctx.arc(
        current.x,
        current.y,
        10,
        0,
        Math.PI * 2
    );

    ctx.strokeStyle =
        "white";

    ctx.lineWidth = 3;

    ctx.stroke();

}


/* =========================================
   화면의 스트라이크존 위치
========================================= */

function getZone() {

    const rect =
        zone.getBoundingClientRect();

    return {

        left: rect.left,

        right: rect.right,

        top: rect.top,

        bottom: rect.bottom

    };

}


/* =========================================
   자동 판정
========================================= */

function judgeBall(ball) {

    if (hasJudged) {
        return;
    }


    const p =
        screenPosition(ball);


    const z =
        getZone();


    /*
      공이 스트라이크존의
      아래쪽 판정선을 통과했을 때 판정

      공 중심의 x/y가
      9칸 영역 안이면 STRIKE

      아니면 BALL
    */

    const passedLine =
        p.y >= z.bottom;


    if (!passedLine) {
        return;
    }


    hasJudged = true;


    const inside =
        p.x >= z.left &&
        p.x <= z.right &&
        p.y >= z.top &&
        p.y <= z.bottom;


    /*
      판정
    */

    if (inside) {

        makeStrike();

    }
    else {

        makeBall();

    }

}


/* =========================================
   STRIKE
========================================= */

function makeStrike() {

    tracking = false;

    strikes++;

    strikeText.textContent =
        strikes;

    showResult(
        "STRIKE",
        "스트라이크"
    );


    if (strikes >= 3) {

        setTimeout(
            () => {

                showResult(
                    "STRIKEOUT",
                    "삼진"
                );

                strikes = 0;
                balls = 0;

                updateCount();

            },
            1200
        );

    }


    pitchButton.textContent =
        "다음 투구";

}


/* =========================================
   BALL
========================================= */

function makeBall() {

    tracking = false;

    balls++;

    ballText.textContent =
        balls;

    showResult(
        "BALL",
        "볼"
    );


    if (balls >= 4) {

        setTimeout(
            () => {

                showResult(
                    "WALK",
                    "볼넷"
                );

                strikes = 0;
                balls = 0;

                updateCount();

            },
            1200
        );

    }


    pitchButton.textContent =
        "다음 투구";

}


/* =========================================
   결과 표시
========================================= */

function showResult(
    text,
    voice
) {

    result.textContent =
        text;

    result.style.display =
        "block";


    try {

        speechSynthesis.cancel();

        const utterance =
            new SpeechSynthesisUtterance(
                voice
            );

        utterance.lang =
            "ko-KR";

        utterance.rate =
            1;

        speechSynthesis.speak(
            utterance
        );

    }

    catch(e) {}


    clearTimeout(
        window.resultTimer
    );


    window.resultTimer =
        setTimeout(
            () => {

                result.style.display =
                    "none";

            },
            1500
        );

}


/* =========================================
   카운트
========================================= */

function updateCount() {

    strikeText.textContent =
        strikes;

    ballText.textContent =
        balls;

}


/* =========================================
   초기화
========================================= */

resetButton.addEventListener(
    "click",
    () => {

        strikes = 0;

        balls = 0;

        tracking = false;

        hasJudged = false;

        lastBall = null;

        ballHistory = [];

        previousFrame = null;

        updateCount();

        result.style.display =
            "none";

        pitchButton.textContent =
            "투구 시작";

        ctx.clearRect(
            0,
            0,
            overlay.width,
            overlay.height
        );

    }
);


/* =========================================
   메인 루프
========================================= */

function loop() {

    requestAnimationFrame(loop);


    if (!tracking) {

        ctx.clearRect(
            0,
            0,
            overlay.width,
            overlay.height
        );

        return;

    }


    framesSinceStart++;


    const ball =
        findBall();


    if (!ball) {

        drawTracking();

        return;

    }


    /*
      공 이동이 너무 큰 경우
      순간적인 오검출을 줄임
    */

    if (lastBall) {

        const distance =
            Math.hypot(
                ball.x -
                lastBall.x,

                ball.y -
                lastBall.y
            );


        if (distance > 80) {

            drawTracking();

            return;

        }

    }


    lastBall =
        ball;


    ballHistory.push(
        ball
    );


    /*
      너무 오래 쌓이지 않게 함
    */

    if (
        ballHistory.length > 30
    ) {

        ballHistory.shift();

    }


    drawTracking();


    /*
      충분히 프레임이 쌓인 뒤
      자동 판정
    */

    if (
        framesSinceStart > 5
    ) {

        judgeBall(ball);

    }

}


/* 시작 */

resize();

loop();

</script>

</body>
</html>
